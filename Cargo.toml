[package]
name = "tokenbar"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_LibraryLoader",
  "Win32_Networking_WinSock",
  "Win32_UI_Shell",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
